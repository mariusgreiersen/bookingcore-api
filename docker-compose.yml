# Local development stack: PostgreSQL + BookingCore API.
#
#   docker compose up --build
#
# Every value can be overridden in a .env file (see .env.example). The defaults below are for local
# development only. Both ports are bound to 127.0.0.1 because the API has no authentication.
name: bookingcore

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookingcore}
      POSTGRES_USER: ${POSTGRES_USER:-bookingcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookingcore}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: bookingcore-api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookingcore}
      DB_USERNAME: ${POSTGRES_USER:-bookingcore}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookingcore}
      # "demo" loads sample rooms and reservations (db/seed). Set to "default" for an empty database.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      # For structured JSON logs (including the requestId MDC field) add:
      # LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
