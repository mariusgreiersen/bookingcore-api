name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B -ntp compile

      - name: Unit and controller tests
        run: ./mvnw -B -ntp test

      # Testcontainers uses the runner's Docker daemon to start a real PostgreSQL.
      # -DskipUTs avoids re-running the unit tests; `verify` also packages the jar and writes the JaCoCo report.
      - name: Integration tests (Testcontainers + PostgreSQL) and package
        run: ./mvnw -B -ntp verify -DskipUTs

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 14

  docker-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Start stack and wait for health checks
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Exercise the API
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS http://localhost:8080/v3/api-docs > /dev/null
          curl -fsS "http://localhost:8080/api/v1/resources?active=true"
          DAY=$(date -u -d '+3 days' +%F)
          START="${DAY}T10:00:00Z"
          END="${DAY}T11:00:00Z"
          BODY="{\"resourceId\":\"11111111-1111-1111-1111-111111111111\",\"customerName\":\"CI\",\"customerEmail\":\"ci@example.com\",\"startTime\":\"$START\",\"endTime\":\"$END\"}"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$BODY" http://localhost:8080/api/v1/reservations)" = 201
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$BODY" http://localhost:8080/api/v1/reservations)" = 409

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
